<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>邮箱验证成功</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f6f8fb;
      color: #172033;
    }

    body {
      align-items: center;
      display: flex;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      max-width: 440px;
      text-align: center;
    }

    .mark {
      align-items: center;
      background: #e5f6ec;
      border: 2px solid #2d8a51; 
      border-radius: 50%;
      color: #1f6d3d;
      display: flex;
      font-size: 32px;
      font-weight: 700;
      height: 68px;
      justify-content: center;
      margin: 0 auto 24px;
      width: 68px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    p {
      color: #526075;
      font-size: 16px;
      line-height: 1.7;
      margin: 0;
    }

    .hint {
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">OK</div>
    <h1>邮箱验证成功</h1>
    <p>你的邮箱已经完成验证。</p>
    <p class="hint">请返回“设备与账户”App，使用邮箱和密码登录验证。
若无法登录，说明链接和验证码已失去时效，请在 App 中重新发送验证邮件。</p>
  </main>
</body>
</html>
